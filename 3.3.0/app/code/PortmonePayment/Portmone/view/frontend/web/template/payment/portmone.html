<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()" />
        <label data-bind="attr: {'for': getCode()}" class="label"><span data-bind="text: getTitle()"></span></label>
    </div>

    <div class="payment-method-content">

        <!-- ko foreach: getRegion('messages') -->
             <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->

        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>

        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
                <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="button"
                        data-bind="
                            click: portmonePlaceOrder.bind($data, 'full', 'redirect'),
                            attr: {title: getButtonText()},
                            css: {disabled: !isPlaceOrderActionAllowed()},
                            enable: (getCode() == isChecked()),
                            visible: isRedirectMode(),
                            style: getButtonStyles()
                            "
                        disabled>
                    <span data-bind="text: getButtonText()"></span>
                </button>
            </div>
            <div class="primary" style="margin: 0 5px">
                <button class="action primary checkout"
                        type="button"
                        data-bind="
                            click: portmonePlaceOrder.bind($data, 'installment', 'redirect'),
                            attr: {title: getInstallmentButtonText()},
                            css: {disabled: !isPlaceOrderActionAllowed()},
                            enable: (getCode() == isChecked()),
                            visible: isInstallmentRedirect(),
                            style: getButtonStyles()
                            "
                        disabled>
                    <span data-bind="text: getInstallmentButtonText()"></span>
                </button>
            </div>

            <div class="primary" style="margin: 0 5px">
                <button class="action primary checkout"
                        type="button"
                        data-bind="
                            click: portmonePlaceOrder.bind($data, 'full', 'iframe'),
                            attr: {title: getButtonText()},
                            css: {disabled: !isPlaceOrderActionAllowed()},
                            enable: (getCode() == isChecked()),
                            visible: isIframeMode(),
                            style: getButtonStyles()
                            "
                        disabled>
                    <span data-bind="text: getButtonText()"></span>
                </button>
            </div>
            <div class="primary" style="margin: 0 5px">
                <button class="action primary checkout"
                        type="button"
                        data-bind="
                            click: portmonePlaceOrder.bind($data, 'installment', 'iframe'),
                            attr: {title: getInstallmentButtonText()},
                            css: {disabled: !isPlaceOrderActionAllowed()},
                            enable: (getCode() == isChecked()),
                            visible: isInstallmentIframe(),
                           style: getButtonStyles()
                            "
                        disabled>
                    <span data-bind="text: getInstallmentButtonText()"></span>
                </button>
            </div>
            <!-- Прихована кнопка для ініціалізації фрейму з JS -->
            <button id="portmone-hidden-trigger-btn"
                    type="button"
                    style="display: none;">
            </button>
        </div>
    </div>
</div>
